<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الناظم — الديون</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-enter">
  <div class="topbar">
    <h1>الديون</h1>
    <div class="topbar-actions">
      <span id="debtSum" style="font-size:12px;color:var(--expired);font-weight:800;"></span>
      <button onclick="logout()" title="خروج">⏻</button>
    </div>
  </div>

  <div class="container">
    <div class="page-title">الديون</div>
    <div class="page-sub">المشتركين عليهم ديون</div>

    <div id="debtList" style="margin-top:14px;">
      <div class="spinner">جاري التحميل...</div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <a href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>الرئيسية</span>
    </a>
    <a href="customers.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span>العملاء</span>
    </a>
    <a href="billing.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>الفواتير</span>
    </a>
    <a href="debts.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      <span>الديون</span>
    </a>
    <a href="more.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>المزيد</span>
    </a>
  </nav>

  <script src="js/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('redirect');

    function renderDebts(data) {
      const items = (data && data.items) || [];
      let total = 0;
      items.forEach(x => total += x.total_debt || 0);
      document.getElementById('debtSum').textContent = formatDinar(total);
      const box = document.getElementById('debtList');
      if (!items.length) {
        box.innerHTML = '<div class="empty"><div class="big">✅</div>لا توجد ديون — كل شيء مدفوع</div>';
        return;
      }
      box.innerHTML = items.map(x => {
        const wa = (x.phone || '').replace(/[^0-9]/g, '');
        return '<div class="card" style="padding:14px;margin-bottom:10px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:14px;font-weight:700;">' + esc(x.name) + '</div>' +
              '<div style="font-size:11px;color:var(--muted);margin-top:2px;">' + esc(x.package_name || '') +
                (x.region ? ' · ' + esc(x.region) : '') + ' · ' + toArabicNum(x.unpaid_count || 0) + ' فاتورة' +
              '</div>' +
            '</div>' +
            '<div style="text-align:left;flex-shrink:0;">' +
              '<div style="font-size:16px;font-weight:800;color:var(--expired);">' + formatDinar(x.total_debt || 0) + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">' +
            '<a class="btn" style="text-decoration:none;font-size:13px;" href="customer-detail.html?id=' + x.customer_id + '">تسديد</a>' +
            (wa ? '<a class="wa-btn" style="margin-top:0;text-decoration:none;" href="https://wa.me/' + wa + '?text=' + encodeURIComponent('عزيزي ' + x.name + '، لديك مبلغ مستحق ' + (x.total_debt || 0) + ' د.ع — يرجى التسديد.') + '">واتساب تذكير</a>' : '') +
          '</div>' +
        '</div>';
      }).join('');
    }

    loadCached('debts', '/debts', renderDebts, (err) => {
      document.getElementById('debtList').innerHTML = '<div class="empty">' + esc(err) + '</div>';
      showToast(err, 'error');
    });
  </script>
</body>
</html>
