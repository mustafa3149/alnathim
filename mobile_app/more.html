<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الناظم — المزيد</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-enter">
  <div class="topbar">
    <h1>المزيد</h1>
    <div class="topbar-actions">
      <span id="roleLabel" style="font-size:12px;color:var(--muted);font-weight:700;"></span>
      <button onclick="logout()" title="خروج">⏻</button>
    </div>
  </div>

  <div class="container">
    <div class="page-title">المزيد</div>
    <div class="page-sub">التقرير والإعدادات</div>

    <!-- Report -->
    <div class="section-label">التقرير الشهري</div>
    <div style="display:flex;gap:10px;">
      <div class="field" style="flex:1;margin-bottom:0;">
        <label>الشهر</label>
        <select id="rMonth" class="input" onchange="loadReport()">
          <option value="1">كانون الثاني</option>
          <option value="2">شباط</option>
          <option value="3">آذار</option>
          <option value="4">نيسان</option>
          <option value="5">أيار</option>
          <option value="6">حزيران</option>
          <option value="7">تموز</option>
          <option value="8">آب</option>
          <option value="9">أيلول</option>
          <option value="10">تشرين الأول</option>
          <option value="11">تشرين الثاني</option>
          <option value="12">كانون الأول</option>
        </select>
      </div>
      <div class="field" style="flex:1;margin-bottom:0;">
        <label>السنة</label>
        <input type="number" id="rYear" class="input" value="" onchange="loadReport()">
      </div>
    </div>

    <div id="reportBox" style="margin-top:12px;"></div>

    <!-- Payments -->
    <div class="section-label">آخر المدفوعات</div>
    <div id="paymentsBox" style="margin-top:6px;"></div>

    <!-- System -->
    <div class="section-label">النظام</div>
    <div class="menu-list">
      <a href="#" onclick="toggleServer();return false;" class="menu-row">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <div class="menu-text"><div class="menu-title">إعداد الخادم</div><div class="menu-sub">عنوان السيرفر والاتصال</div></div>
        <span class="menu-arrow">‹</span>
      </a>
      <a href="#" onclick="logout();return false;" class="menu-row" style="color:var(--expired);">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <div class="menu-text"><div class="menu-title">تسجيل الخروج</div><div class="menu-sub">إنهاء الجلسة</div></div>
        <span class="menu-arrow">‹</span>
      </a>
    </div>

    <!-- Server panel -->
    <div id="serverPanel" class="hidden" style="margin-top:16px;">
      <div class="card card-pad">
        <div class="field">
          <label>عنوان السيرفر</label>
          <input type="text" id="serverUrl" class="input" dir="ltr">
        </div>
        <button class="btn-primary" onclick="saveServer()">حفظ العنوان</button>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <a href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>الرئيسية</span>
    </a>
    <a href="customers.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span>العملاء</span>
    </a>
    <a href="billing.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>الفواتير</span>
    </a>
    <a href="debts.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      <span>الديون</span>
    </a>
    <a href="more.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>المزيد</span>
    </a>
  </nav>

  <script src="js/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('redirect');

    const u = getUser();
    if (u) document.getElementById('roleLabel').textContent = u.role === 'admin' ? 'مدير' : (u.full_name || u.username || '');
    const now = new Date();
    document.getElementById('rMonth').value = String(now.getMonth() + 1);
    document.getElementById('rYear').value = String(now.getFullYear());

    function loadReport() {
      const month = document.getElementById('rMonth').value;
      const year = document.getElementById('rYear').value;
      const box = document.getElementById('reportBox');
      // Silent refresh: show cached report instantly, update quietly.
      const cached = cacheGet('report_' + month + '_' + year);
      if (cached) renderReport(cached);
      api('/report?month=' + month + '&year=' + year).then(d => {
        if (d.ok) {
          cacheSet('report_' + month + '_' + year, d.data);
          renderReport(d.data);
        }
      });
    }

    function renderReport(r) {
      const box = document.getElementById('reportBox');
      box.innerHTML =
          '<div class="kpi-grid">' +
            '<div class="kpi"><div class="k-label">المتوقع</div><div class="k-value">' + formatDinar(r.expected || 0) + '</div></div>' +
            '<div class="kpi"><div class="k-label">المحصل</div><div class="k-value" style="color:var(--active);">' + formatDinar(r.collected || 0) + '</div></div>' +
            '<div class="kpi"><div class="k-label">المصاريف</div><div class="k-value" style="color:var(--expired);">' + formatDinar(r.expenses_total || 0) + '</div></div>' +
            '<div class="kpi"><div class="k-label">صافي الربح</div><div class="k-value">' + formatDinar(r.net_profit || 0) + '</div></div>' +
            '<div class="kpi"><div class="k-label">المتبقي</div><div class="k-value" style="color:var(--expired);">' + formatDinar(r.remaining || 0) + '</div></div>' +
            '<div class="kpi"><div class="k-label">إجمالي الديون</div><div class="k-value" style="color:var(--expired);">' + formatDinar(r.total_debt || 0) + '</div></div>' +
          '</div>' +
          '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:10px;">' +
            '<span>فواتير: ' + toArabicNum(r.total_invoices || 0) + '</span>' +
            '<span>مدفوعة: ' + toArabicNum(r.paid_count || 0) + '</span>' +
            '<span>غير مدفوعة: ' + toArabicNum(r.unpaid_count || 0) + '</span>' +
          '</div>';
    }

    function loadPayments() {
      const box = document.getElementById('paymentsBox');

      function render(data) {
        const items = (data && data.items) || [];
        if (!items.length) {
          box.innerHTML = '<div class="empty"><div class="big">💳</div>لا مدفوعات بعد</div>';
          return;
        }
        box.innerHTML = '<div class="list-card">' + items.map(p =>
          '<div class="row">' +
            '<div class="row-main">' +
              '<div class="row-title">' + esc(p.customer_name || 'زبون #' + p.customer_id) + '</div>' +
              '<div class="row-sub">' + esc(p.payment_date || '') + ' · ' + esc(p.payment_method || '') + '</div>' +
            '</div>' +
            '<div class="row-end" style="font-weight:800;color:var(--active);">' + formatDinar(p.amount || 0) + '</div>' +
          '</div>').join('') + '</div>';
      }

      // Cache-first (Blood-style): show instantly, refresh silently.
      const cached = cacheGet('payments');
      if (cached) render(cached);
      api('/payments?limit=30').then(d => {
        if (d.ok) {
          cacheSet('payments', d.data);
          render(d.data);
        }
        // server offline → keep what we have, nothing visible happens
      });
    }

    function toggleServer() {
      const panel = document.getElementById('serverPanel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) {
        document.getElementById('serverUrl').value = getServerBase();
      }
    }

    function saveServer() {
      const url = document.getElementById('serverUrl').value.trim().replace(/\/+$/, '');
      if (!url) return;
      localStorage.setItem('alnathim_server', url);
      refreshApiBase();
      showToast('تم حفظ عنوان السيرفر ✓');
    }

    loadReport();
    loadPayments();
  </script>
</body>
</html>
