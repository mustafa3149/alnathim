<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الناظم — العملاء</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-enter">
  <div class="topbar">
    <h1>العملاء</h1>
    <div class="topbar-actions">
      <span id="countLabel" style="font-size:12px;color:var(--muted);font-weight:700;"></span>
      <button onclick="logout()" title="خروج">⏻</button>
    </div>
  </div>

  <div class="container">
    <div class="page-title">العملاء</div>
    <div class="page-sub">إدارة المشتركين والبحث</div>

    <div style="margin-top:14px;">
      <input type="text" id="searchInput" class="input" placeholder="ابحث بالاسم أو الهاتف..." oninput="renderFiltered()">
    </div>

    <div class="chips" style="margin-top:10px;" id="statusChips">
      <button class="chip active" data-s="all" onclick="setStatus(this,'all')">الكل</button>
      <button class="chip" data-s="active" onclick="setStatus(this,'active')">نشط</button>
      <button class="chip" data-s="expired" onclick="setStatus(this,'expired')">منتهي</button>
      <button class="chip" data-s="debt" onclick="setStatus(this,'debt')">مدين</button>
    </div>

    <div id="customerList" style="margin-top:14px;">
      <div class="spinner">جاري التحميل...</div>
    </div>
  </div>

  <!-- Floating add button -->
  <button class="fab" onclick="openSheet('addSheet')">+</button>

  <!-- Add customer sheet -->
  <div class="sheet-overlay" id="addSheet" onclick="if(event.target===this)closeSheet('addSheet')">
    <div class="sheet">
      <div class="sheet-grab"></div>
      <button class="sheet-close" onclick="closeSheet('addSheet')">✕</button>
      <div class="sheet-title">إضافة مشترك جديد</div>
      <div class="field"><label>الاسم *</label><input type="text" id="cName" class="input" placeholder="اسم المشترك"></div>
      <div class="field"><label>الهاتف</label><input type="text" id="cPhone" class="input" dir="ltr" placeholder="07xxxxxxxxx"></div>
      <div class="field"><label>الباقة</label><input type="text" id="cPackage" class="input" placeholder="مثال: 4M"></div>
      <div class="field"><label>سعر الباقة (د.ع)</label><input type="number" id="cPrice" class="input" value="25000" inputmode="numeric"></div>
      <div class="field"><label>مدة الاشتراك (أشهر)</label><input type="number" id="cMonths" class="input" value="1" min="1" inputmode="numeric"></div>
      <div class="field"><label>دين سابق (د.ع)</label><input type="number" id="cDebt" class="input" value="0" inputmode="numeric"></div>
      <div class="field"><label>العنوان</label><input type="text" id="cAddress" class="input"></div>
      <div class="field"><label>المنطقة</label><input type="text" id="cRegion" class="input"></div>
      <div class="field"><label>ملاحظات</label><input type="text" id="cNotes" class="input"></div>
      <button class="btn-primary" id="addCustBtn" onclick="addCustomer()">حفظ المشترك</button>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <a href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>الرئيسية</span>
    </a>
    <a href="customers.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span>العملاء</span>
    </a>
    <a href="billing.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>الفواتير</span>
    </a>
    <a href="debts.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      <span>الديون</span>
    </a>
    <a href="more.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>المزيد</span>
    </a>
  </nav>

  <script src="js/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('redirect');

    let allCustomers = [];
    let debtMap = {};
    let currentStatus = 'all';

    function setStatus(btn, s) {
      currentStatus = s;
      document.querySelectorAll('#statusChips .chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderFiltered();
    }

    function renderFiltered() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      let list = allCustomers;
      if (q) {
        list = list.filter(c => (c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q));
      }
      if (currentStatus === 'active') list = list.filter(c => customerState(c) === 'active');
      else if (currentStatus === 'expired') list = list.filter(c => customerState(c) === 'expired' || customerState(c) === 'inactive');
      else if (currentStatus === 'debt') list = list.filter(c => (debtMap[c.id] || 0) > 0);

      document.getElementById('countLabel').textContent = toArabicNum(list.length) + ' مشترك';
      const box = document.getElementById('customerList');
      if (!list.length) {
        box.innerHTML = '<div class="empty"><div class="big">👥</div>لا يوجد عملاء مطابقون</div>';
        return;
      }
      box.innerHTML = '<div class="list-card">' + list.map(c => {
        const st = customerState(c);
        const debt = debtMap[c.id] || 0;
        return '<a class="row" href="customer-detail.html?id=' + c.id + '">' +
          stateDot(st) +
          '<div class="row-main">' +
            '<div class="row-title">' + esc(c.name) + '</div>' +
            '<div class="row-sub">' + esc(c.phone || '') + ' · ' + esc(c.package_name || '') + '</div>' +
          '</div>' +
          '<div class="row-end">' +
            '<div style="font-size:11px;color:var(--muted);font-weight:700;">' + stateText(st) + '</div>' +
            (debt > 0 ? '<div style="font-size:11px;font-weight:800;color:var(--expired);">' + formatDinar(debt) + '</div>' : '') +
          '</div>' +
          '<span class="menu-arrow">‹</span>' +
        '</a>';
      }).join('') + '</div>';
    }

    function renderCached(list) {
      allCustomers = list;
      renderFiltered();
    }

    async function load() {
      const cached = cacheGet('customers');
      if (cached && (cached.items || cached)) {
        renderCached(cached.items || cached);
      }
      const d = await api('/customers');
      const dd = await api('/debts');
      if (d.ok) {
        const items = d.data.items || [];
        cacheSet('customers', d.data);
        if (dd.ok) {
          debtMap = {};
          (dd.data.items || []).forEach(x => { debtMap[x.customer_id] = x.total_debt || 0; });
        }
        allCustomers = items;
        renderFiltered();
      } else if (!cached) {
        document.getElementById('customerList').innerHTML = '<div class="empty">' + esc((d.error && d.error.message_ar) || 'تعذر التحميل') + '</div>';
      }
    }

    async function addCustomer() {
      const name = document.getElementById('cName').value.trim();
      if (!name) { showToast('أدخل اسم المشترك', 'error'); return; }
      const body = {
        name: name,
        phone: document.getElementById('cPhone').value.trim(),
        package_name: document.getElementById('cPackage').value.trim(),
        package_price: parseInt(document.getElementById('cPrice').value) || 0,
        duration_months: Math.max(1, parseInt(document.getElementById('cMonths').value) || 1),
        previous_debt: parseInt(document.getElementById('cDebt').value) || 0,
        address: document.getElementById('cAddress').value.trim(),
        region: document.getElementById('cRegion').value.trim(),
        notes: document.getElementById('cNotes').value.trim()
      };
      const btn = document.getElementById('addCustBtn');
      btn.textContent = '⏳ جاري الحفظ...'; btn.disabled = true;
      const d = await api('/customers', body);
      btn.textContent = 'حفظ المشترك'; btn.disabled = false;
      if (d.ok) {
        closeSheet('addSheet');
        showToast('تمت إضافة المشترك ✓');
        ['cName','cPhone','cPackage','cAddress','cRegion','cNotes'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('cPrice').value = '25000';
        document.getElementById('cMonths').value = '1';
        document.getElementById('cDebt').value = '0';
        load();
      } else {
        showToast((d.error && d.error.message_ar) || 'فشل الإضافة', 'error');
      }
    }

    load();
  </script>
</body>
</html>
