{% extends "layout.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div style="max-width:420px;margin:60px auto;padding:0 16px;">
    <div class="card">
        <div class="card-header" style="text-align:center;font-size:16px;font-weight:700;">🔐 تسجيل الدخول</div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:14px;">
            <div>
                <label class="f-label">اسم المستخدم</label>
                <input type="text" id="username" class="input" dir="ltr" placeholder="example_user">
            </div>
            <div>
                <label class="f-label">كلمة المرور</label>
                <input type="password" id="password" class="input" dir="ltr" placeholder="••••••••">
            </div>
            <button onclick="doLogin()" class="btn btn-primary" style="width:100%;">دخول</button>
            <p style="text-align:center;font-size:13px;color:#777;">
                ليس لديك حساب؟ <a href="/register" style="color:#1e3a5f;font-weight:600;">إنشاء حساب جديد</a>
            </p>
            <p style="text-align:center;font-size:12px;color:#aaa;border-top:1px solid #f0f0f0;padding-top:10px;">
                هل أنت مدير المنصة؟ <a href="/superadmin/login" style="color:#0d6e3c;font-weight:600;">دخول المدير</a>
            </p>
        </div>
    </div>
</div>
<style>.f-label{font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:4px;}</style>
<script>
async function doLogin() {
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    if (!u || !p) { showToast('أدخل اسم المستخدم وكلمة المرور', 'error'); return; }
    showToast('جاري الدخول...');
    var r = await fetch('/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: u, password: p})
    });
    var d = await r.json();
    if (d.ok) {
        showToast('✅ تم تسجيل الدخول بنجاح');
        setTimeout(function(){ window.location.href = '/'; }, 400);
    } else {
        showToast('❌ ' + (d.error || 'فشل الدخول'), 'error');
    }
}
document.getElementById('password').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
</script>
{% endblock %}
