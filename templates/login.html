{% extends "layout.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh]">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <img src="/static/assets/al-nazim-icon.svg" alt="الناظم" class="w-16 h-16 rounded-2xl mb-3 shadow-lg shadow-indigo-500/20">
      <h1 class="text-2xl font-extrabold text-slate-50">الناظم</h1>
      <p class="text-sm text-slate-400 font-tajawal mt-1">نظام إدارة أبراج الإنترنت</p>
    </div>

    <div class="rounded-2xl bg-slate-800/70 border border-slate-700/60 backdrop-blur p-6 shadow-2xl">
      <div class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 font-semibold mb-1.5 block">اسم المستخدم</label>
          <input type="text" id="username" dir="ltr" placeholder="اسم المستخدم" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-slate-50 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-semibold mb-1.5 block">كلمة المرور</label>
          <input type="password" id="password" dir="ltr" placeholder="••••••••" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-slate-50 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition">
        </div>
        <button onclick="doLogin()" class="w-full rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold py-3 transition shadow-lg shadow-indigo-500/30">دخول</button>
        <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:12px;">
          ليس لديك حساب؟ <a href="/register" style="color:var(--dot-active);font-weight:600;">إنشاء حساب</a>
        </p>
      </div>
    </div>

    <div class="rounded-2xl bg-slate-900/60 border border-slate-700/50 p-5 mt-4 shadow-xl" dir="rtl">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-bold text-slate-400">معرّف هذا الجهاز (HWID)</span>
        <button onclick="copyHwid()" class="text-[11px] px-2 py-1 rounded-lg bg-slate-800 border border-slate-700 text-indigo-300 hover:border-indigo-500 transition">نسخ</button>
      </div>
      <div id="hwidBox" class="text-[11px] font-mono text-slate-300 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 break-all text-left" dir="ltr">...</div>
      <input type="text" id="activationKey" dir="ltr" placeholder="ألصق كود التفعيل هنا" class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-2.5 text-slate-50 text-xs mt-3 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition">
      <button onclick="activateDevice()" class="w-full rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-2.5 text-sm mt-2 transition shadow-lg shadow-emerald-500/20">تفعيل هذه الحاسبة</button>
    </div>
  </div>
<script>
var deviceHwid='';
async function loadHwid(){
  try{
    var r=await fetch('/api/device/hwid');
    var d=await r.json();
    if(d.ok){deviceHwid=d.hwid;document.getElementById('hwidBox').textContent=deviceHwid;}
  }catch(e){}
}
function copyHwid(){
  if(deviceHwid){navigator.clipboard.writeText(deviceHwid).then(function(){showToast('تم نسخ المعرّف');}).catch(function(){showToast('تعذر النسخ','error');});}
}
async function activateDevice(){
  var key=document.getElementById('activationKey').value.trim();
  if(!key){showToast('أدخل كود التفعيل','error');return;}
  if(!deviceHwid){showToast('لم يتم تحميل معرّف الجهاز','error');return;}
  showToast('جاري التحقق من كود التفعيل...');
  var r=await fetch('/api/device/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({activation_key:key,hwid:deviceHwid})});
  var d=await r.json();
  if(d.ok&&d.approved){
    showToast('✅ تم تفعيل الحاسبة');
    localStorage.setItem('alnathim_token',d.token||'');
    localStorage.setItem('alnathim_user_id',String(d.user_id||''));
    setTimeout(function(){window.location.href='/';},500);
  }
  else{showToast('❌ '+(d.error||'كود التفعيل غير صالح'),'error');}
}
async function doLogin(){
  var u=document.getElementById('username').value.trim();var p=document.getElementById('password').value;
  if(!u||!p){showToast('أدخل اسم المستخدم وكلمة المرور','error');return;}
  showToast('جاري الدخول...');
  var r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  var d=await r.json();
  if(d.ok){showToast('✅ تم تسجيل الدخول بنجاح');setTimeout(function(){window.location.href=(d.redirect || '/');},400);}
  else{showToast('❌ '+(d.error||'فشل الدخول'),'error');}
}
document.getElementById('password').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
loadHwid();
</script>
{% endblock %}
