<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>الناظم - {% block title %}لوحة القيادة{% endblock %}</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="الناظم">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ─────────────── Design Tokens (Premium Monochrome) ─────────────── */
    :root {
      --bg:#0a0a0a; --surface:#141414; --surface-2:#1c1c1c; --surface-3:#242424;
      --border:#232323; --border-2:#333333;
      --text:#fafafa; --muted:#a3a3a3; --faint:#6f6f6f;
      --dot-active:#22c55e; --dot-expired:#ef4444; --dot-suspended:#737373;
      --toast-bg:#fafafa; --toast-text:#0a0a0a;
      --modal-dim:rgba(0,0,0,0.6);
      --header-bg:rgba(10,10,10,0.82);
      --nav-bg:rgba(10,10,10,0.92);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg:#fafafa; --surface:#ffffff; --surface-2:#f4f4f4; --surface-3:#ececec;
        --border:#e5e5e5; --border-2:#d4d4d4;
        --text:#171717; --muted:#737373; --faint:#a3a3a3;
        --dot-active:#16a34a; --dot-expired:#dc2626; --dot-suspended:#a3a3a3;
        --toast-bg:#171717; --toast-text:#fafafa;
        --modal-dim:rgba(0,0,0,0.35);
        --header-bg:rgba(250,250,250,0.82);
        --nav-bg:rgba(250,250,250,0.92);
      }
    }
    :root[data-theme="light"] {
      --bg:#fafafa; --surface:#ffffff; --surface-2:#f4f4f4; --surface-3:#ececec;
      --border:#e5e5e5; --border-2:#d4d4d4;
      --text:#171717; --muted:#737373; --faint:#a3a3a3;
      --dot-active:#16a34a; --dot-expired:#dc2626; --dot-suspended:#a3a3a3;
      --toast-bg:#171717; --toast-text:#fafafa;
      --modal-dim:rgba(0,0,0,0.35);
      --header-bg:rgba(250,250,250,0.82);
      --nav-bg:rgba(250,250,250,0.92);
    }

    body {
      font-family:'Cairo','Tajawal','Segoe UI',sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }
    .font-tajawal { font-family:'Tajawal','Cairo',sans-serif; }

    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:4px; }
    ::selection { background:var(--text); color:var(--bg); }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

    /* ─────────────── Native text selection (Android WebView) ───────────────
       Allow the browser's native long-press context menu (Select/Copy/Paste)
       on input fields. `-webkit-touch-callout: none` on body prevents a long
       press on background from opening iOS-style callouts, while inputs keep
       the native Android ActionMode (خصائص متصفح أندرويد الأصلية). */
    input, textarea {
        -webkit-user-select: text !important;
        user-select: text !important;
        -webkit-touch-callout: default !important;
    }
    body {
        -webkit-touch-callout: none;
    }

    /* ─────────────── Surfaces ─────────────── */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; }
    .card-pad { padding:20px; }
    .surface-2 { background:var(--surface-2); }
    .divider { border-bottom:1px solid var(--border); }

    /* ─────────────── Buttons (monochrome, Apple-style) ─────────────── */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 18px; font-weight:600; font-size:14px; border-radius:12px; cursor:pointer; transition:all .15s ease; min-height:42px; border:1px solid var(--border-2); background:var(--surface-2); color:var(--text); }
    .btn:hover { background:var(--surface-3); }
    .btn:active { transform:scale(.98); }
    .btn-primary { background:var(--text); border-color:var(--text); color:var(--bg); } .btn-primary:hover{ background:var(--muted); border-color:var(--muted); }
    .btn-danger { background:transparent; border-color:var(--border-2); color:var(--dot-expired); } .btn-danger:hover{ background:var(--dot-expired); border-color:var(--dot-expired); color:#fff; }
    .btn-sm { padding:6px 12px; font-size:12px; min-height:34px; border-radius:10px; }
    .btn-icon { width:38px; height:38px; padding:0; border-radius:12px; }

    /* ─────────────── Inputs ─────────────── */
    .input { width:100%; padding:11px 14px; font-size:14px; border:1px solid var(--border-2); background:var(--surface); color:var(--text); border-radius:12px; transition:border-color .15s ease; }
    .input:focus { outline:none; border-color:var(--text); }
    .input::placeholder { color:var(--faint); }

    /* ─────────────── Status dots (semantic color ONLY) ─────────────── */
    .dot { display:inline-block; width:7px; height:7px; border-radius:9999px; flex-shrink:0; }
    .dot-active { background:var(--dot-active); }
    .dot-expired { background:var(--dot-expired); }
    .dot-suspended { background:var(--dot-suspended); }

    /* ─────────────── Table ─────────────── */
    table { width:100%; border-collapse:collapse; }
    table th { text-align:right; padding:12px 16px; font-size:11px; font-weight:700; color:var(--muted); border-bottom:1px solid var(--border); background:var(--surface-2); }
    table td { padding:12px 16px; font-size:13px; border-bottom:1px solid var(--border); color:var(--text); }
    table tr:last-child td { border-bottom:none; }
    table tr:hover td { background:var(--surface-2); }

    /* ─────────────── Modal / Bottom Sheet ─────────────── */
    .modal-overlay { position:fixed; inset:0; z-index:50; background:var(--modal-dim); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px; }
    .modal-box { margin:auto; background:var(--surface); border:1px solid var(--border); border-radius:16px; color:var(--text); padding:24px; width:100%; }
    .sheet { background:var(--surface); border:1px solid var(--border); border-radius:20px; }

    .f-label { font-size:12px; font-weight:600; color:var(--muted); display:block; margin-bottom:5px; }
    .stat-value { font-size:30px; font-weight:800; color:var(--text); line-height:1.15; letter-spacing:-0.02em; }
    .stat-label { font-size:12px; color:var(--muted); margin-top:4px; }
    .text-main { color:var(--text); }
    .text-muted { color:var(--muted); }
    .text-faint { color:var(--faint); }

    /* ─────────────── Bottom navigation states ─────────────── */
    .active-nav { color:var(--text); }
    .nav-inactive { color:var(--faint); }
    .nav-inactive:hover { color:var(--muted); }
    .nav-indicator { position:absolute; top:0; right:0; left:0; height:2px; border-radius:9999px; background:var(--text); opacity:0; transition:opacity .15s ease; }
    .active-nav .nav-indicator { opacity:1; }

    /* ─────────────── Segmented tabs (Ping|Sectors|SNMP) ─────────────── */
    .tab-btn { border-radius:8px; padding:10px 0; font-size:13px; font-weight:700; color:var(--muted); transition:all .2s ease-in-out; }
    .tab-btn:hover { color:var(--text); }
    .tab-btn.tab-active { background:var(--text); color:var(--bg); }

    /* ─────────────── Mobile tap feel + transitions ─────────────── */
    .btn { transition:all .2s ease-in-out, transform .1s ease; }
    .btn:active { transform:scale(.95); }
    .card { transition:all .2s ease-in-out; }
    .card:active { transform:scale(.95); }
    .modal-overlay { transition:opacity .2s ease-in-out; }
    .sheet { transition:transform .2s ease-in-out, opacity .2s ease-in-out; }

    /* ─────────────── Legacy safe overrides (tables/misc on other pages) ─────────────── */
    .glass { background:var(--header-bg); backdrop-filter:blur(14px); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-app min-h-screen" style="background:var(--bg);">

  <!-- Top Header -->
  <header class="sticky top-0 z-40 glass border-b" style="border-color:var(--border);">
    <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-3">
      <a href="/" class="flex items-center gap-2.5">
        <img src="/static/assets/al-nazim-icon.svg" alt="الناظم" class="w-9 h-9 rounded-xl" style="filter:drop-shadow(0 0 0 transparent);">
        <span class="font-bold text-lg" style="color:var(--text);">الناظم</span>
      </a>
      <div class="flex items-center gap-1">
        <span class="text-sm font-tajawal hidden sm:block" style="color:var(--muted);">{{ session.get('user_name') or 'مدير' }}</span>
        <!-- Theme toggle -->
        <button onclick="toggleTheme()" id="themeToggle" class="p-2 transition hover:opacity-70" title="الوضع الليلي / النهاري" aria-label="تبديل المظهر">
          <svg id="iconSun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg id="iconMoon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);display:none;"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button onclick="logoutNow()" class="p-2 transition hover:opacity-70" title="خروج" aria-label="خروج">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted);"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Page Content -->
  <main class="max-w-4xl mx-auto px-4 pt-6 pb-32">
    {% block content %}{% endblock %}
  </main>

  <!-- Fixed Bottom Navigation (5 tabs — monochrome) -->
  <nav class="fixed bottom-0 inset-x-0 z-40 border-t" style="background:var(--nav-bg);backdrop-filter:blur(14px);border-color:var(--border);">
    <div class="max-w-4xl mx-auto grid {% if g.get('is_admin') %}grid-cols-6{% else %}grid-cols-5{% endif %}">
      <a href="/" class="flex flex-col items-center gap-1 py-3 transition relative {% if request.path == '/' %}active-nav{% else %}nav-inactive{% endif %}">
        <span class="nav-indicator"></span>
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="text-[10px] font-semibold">الرئيسية</span>
      </a>
      <a href="/customers" class="flex flex-col items-center gap-1 py-3 transition relative {% if request.path.startswith('/customers') %}active-nav{% else %}nav-inactive{% endif %}">
        <span class="nav-indicator"></span>
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span class="text-[10px] font-semibold">العملاء</span>
      </a>
      <a href="/billing" class="flex flex-col items-center gap-1 py-3 transition relative {% if request.path.startswith('/billing') %}active-nav{% else %}nav-inactive{% endif %}">
        <span class="nav-indicator"></span>
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span class="text-[10px] font-semibold">الفواتير</span>
      </a>
      <a href="/report" class="flex flex-col items-center gap-1 py-3 transition relative {% if request.path.startswith('/report') %}active-nav{% else %}nav-inactive{% endif %}">
        <span class="nav-indicator"></span>
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg>
        <span class="text-[10px] font-semibold">المالية</span>
      </a>
      <a href="/more" class="flex flex-col items-center gap-1 py-3 transition relative {% if request.path.startswith('/more') %}active-nav{% else %}nav-inactive{% endif %}">
        <span class="nav-indicator"></span>
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        <span class="text-[10px] font-semibold">الإعدادات</span>
      </a>
      {% if g.get('is_admin') %}
      <a href="/admin" class="flex flex-col items-center gap-1 py-3 transition relative {% if request.path.startswith('/admin') %}active-nav{% else %}nav-inactive{% endif %}">
        <span class="nav-indicator"></span>
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1a3 3 0 00-3 3v2H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V8a2 2 0 00-2-2h-3V4a3 3 0 00-3-3zm0 7a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H8a1 1 0 110-2h3v-3a1 1 0 011-1z"/></svg>
        <span class="text-[10px] font-semibold">الإدارة</span>
      </a>
      {% endif %}
    </div>
  </nav>

  <!-- Payment Modal -->
  <div id="paymentModal" class="fixed inset-0 z-50 hidden overflow-y-auto modal-overlay">
    <div class="min-h-full flex items-center justify-center p-4">
      <div class="sheet max-w-md w-full p-6 shadow-2xl">
        <h3 class="text-lg font-bold mb-4 text-main">تسديد — <span id="payCustName">—</span></h3>
        <input type="hidden" id="payInvoiceId"><input type="hidden" id="payRemaining"><input type="hidden" id="payCustId">
        <div class="space-y-4">
          <div id="payInvoiceInfo" class="flex justify-between text-sm p-3 rounded-xl surface-2 divider"></div>
          <div class="max-h-52 overflow-y-auto space-y-2" id="payInvoiceList"></div>
          <div>
            <label class="f-label">المبلغ</label>
            <div class="flex gap-2">
              <button onclick="adjustPayAmount(-1000)" class="btn btn-sm px-3 text-lg font-bold" type="button">−</button>
              <input type="number" id="payAmount" class="input flex-1 font-bold text-center" step="1000" min="1000">
              <button onclick="adjustPayAmount(1000)" class="btn btn-sm px-3 text-lg font-bold" type="button">+</button>
              <button onclick="document.getElementById('payAmount').value=document.getElementById('payRemaining').value" class="btn btn-sm px-3">كامل</button>
            </div>
          </div>
          <div><label class="f-label">طريقة الدفع</label><select id="payMethod" class="input"><option value="نقدي">نقدي</option><option value="تحويل">تحويل</option><option value="بطاقة">بطاقة</option><option value="غير ذلك">غير ذلك</option></select></div>
          <div><label class="f-label">تاريخ الدفع</label><input type="date" id="payDate" class="input"></div>
          <div><label class="f-label">ملاحظات</label><input type="text" id="payNotes" class="input" placeholder="اي ملاحظة"></div>
        </div>
        <div class="flex gap-3 mt-5">
          <button onclick="submitSharedPayment()" class="btn btn-primary flex-1 py-3">تاكيد الدفع</button>
          <button onclick="document.getElementById('paymentModal').style.display='none'" class="btn px-5">الغاء</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Pay Modal -->
  <div id="quickPayModal" class="fixed inset-0 z-50 hidden overflow-y-auto modal-overlay">
    <div class="min-h-full flex items-center justify-center p-4">
      <div class="sheet max-w-md w-full p-6 shadow-2xl">
        <h3 class="text-lg font-bold mb-4 text-main">دفع</h3>
        <div class="space-y-4">
          <div class="flex justify-between text-sm p-3 rounded-xl surface-2 divider">
            <span class="text-muted">الكلي: <strong class="text-main" id="quickPayFullAmount">—</strong></span>
            <span class="text-muted">مدفوع: <strong class="text-main" id="quickPayAlreadyPaid">—</strong></span>
            <span class="text-muted">متبقي: <strong class="text-main" id="quickPayRemaining">—</strong></span>
          </div>
          <div>
            <label class="f-label">المبلغ المراد دفعه</label>
            <input type="hidden" id="quickPayMaxAmount" value="0">
            <div class="flex gap-2">
              <button onclick="adjustQuickPay(-1000)" class="btn btn-sm px-3 text-lg font-bold" type="button">−</button>
              <input type="number" id="quickPayAmount" class="input flex-1 font-bold text-center" step="1000" min="1000">
              <button onclick="adjustQuickPay(1000)" class="btn btn-sm px-3 text-lg font-bold" type="button">+</button>
              <button onclick="document.getElementById('quickPayAmount').value=document.getElementById('quickPayMaxAmount').value" class="btn btn-sm px-3">كامل</button>
            </div>
          </div>
          <div><label class="f-label">تاريخ الدفع</label><input type="date" id="quickPayDate" class="input"></div>
          <div><label class="f-label">طريقة الدفع</label><select id="quickPayMethod" class="input"><option value="نقدي">نقدي</option><option value="تحويل">تحويل</option><option value="بطاقة">بطاقة</option><option value="غير ذلك">غير ذلك</option></select></div>
          <div><label class="f-label">ملاحظات</label><input type="text" id="quickPayNotes" class="input" placeholder="اي ملاحظة"></div>
        </div>
        <div class="flex gap-3 mt-5">
          <button onclick="submitQuickPay()" class="btn btn-primary flex-1 py-3">تاكيد الدفع</button>
          <button onclick="document.getElementById('quickPayModal').style.display='none'" class="btn px-5">الغاء</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div id="confirmModal" class="fixed inset-0 z-50 hidden modal-overlay">
    <div class="min-h-full flex items-center justify-center p-4">
      <div class="sheet max-w-sm w-full p-6 shadow-2xl text-center">
        <div id="confirmMsg" class="font-semibold mb-6 text-main">تاكيد</div>
        <div class="flex gap-3 justify-center">
          <button onclick="confirmYes()" class="btn btn-primary flex-1 py-2.5">تاكيد</button>
          <button onclick="confirmNo()" class="btn flex-1 py-2.5">الغاء</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[60] hidden px-5 py-3 rounded-xl font-semibold text-sm shadow-2xl"></div>

  <script>
    var todayStr = new Date().toISOString().split('T')[0];

    /* ─────────────── CSRF auto-attach (Phase 14.5) ─────────────── */
    var CSRF_TOKEN = '{{ csrf_token }}';
    (function(){
      var origFetch = window.fetch;
      window.fetch = function(url, opts){
        opts = opts || {};
        var method = (opts.method || 'GET').toUpperCase();
        var isSameOrigin = !/^https?:\/\//.test(String(url)) || String(url).startsWith(window.location.origin);
        if(method !== 'GET' && isSameOrigin && CSRF_TOKEN){
          opts.headers = opts.headers || {};
          if(opts.headers instanceof Headers){
            if(!opts.headers.has('X-CSRF-Token')) opts.headers.set('X-CSRF-Token', CSRF_TOKEN);
          } else if(!opts.headers['X-CSRF-Token']){
            opts.headers['X-CSRF-Token'] = CSRF_TOKEN;
          }
        }
        return origFetch.call(this, url, opts);
      };
    })();

    /* ─────────────── Dark / Light Theme (system default + manual toggle) ─────────────── */
    function systemPrefersLight(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches; }
    function getStoredTheme(){ try{ return localStorage.getItem('alnathim_theme'); }catch(e){ return null; } }
    function applyThemeState(){
      var t=getStoredTheme();
      if(t==='light'){ document.documentElement.setAttribute('data-theme','light'); }
      else if(t==='dark'){ document.documentElement.setAttribute('data-theme','dark'); }
      else { document.documentElement.removeAttribute('data-theme'); }
      updateThemeIcon();
    }
    function toggleTheme(){
      var current=getStoredTheme();
      if(current==='light'){ try{localStorage.setItem('alnathim_theme','dark');}catch(e){} }
      else if(current==='dark'){ try{localStorage.removeItem('alnathim_theme');}catch(e){} }
      else { try{localStorage.setItem('alnathim_theme', systemPrefersLight()?'dark':'light');}catch(e){} }
      applyThemeState();
    }
    function updateThemeIcon(){
      var t=getStoredTheme();
      var dark = t==='dark' || (!t && !systemPrefersLight());
      document.getElementById('iconSun').style.display = dark ? 'none' : 'block';
      document.getElementById('iconMoon').style.display = dark ? 'block' : 'none';
    }
    applyThemeState();
    if(window.matchMedia) window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyThemeState);

    /* ─────────────── Payment flow (shared) ─────────────── */
    function openPayModal(custId, custName) {
      document.getElementById('payCustName').textContent = custName;
      document.getElementById('payCustId').value = custId;
      document.getElementById('payInvoiceList').innerHTML = '<div class="text-muted text-center py-3">جاري التحميل...</div>';
      document.getElementById('paymentModal').style.display = 'block';
      document.getElementById('payInvoiceId').value=''; document.getElementById('payAmount').value='';
      document.getElementById('payDate').value = todayStr; document.getElementById('payNotes').value='';
      fetch('/api/customers/history/'+custId).then(r=>r.json()).then(d=>{
        var unpaid = d.invoices.filter(i=>!i.is_paid);
        if(unpaid.length===0){
          document.getElementById('payInvoiceList').innerHTML='<p class="text-muted text-center py-3">لا توجد فواتير غير مسددة</p>';
          updatePayInvoiceInfoTotals(0,0,0); return;
        }
        var tA=0,tP=0,tR=0; unpaid.forEach(i=>{tA+=i.total_amount;tP+=i.paid_amount;tR+=(i.total_amount-i.paid_amount);});
        updatePayInvoiceInfoTotals(tA,tP,tR);
        var h='<div class="text-[11px] text-muted mb-2">اختر فاتورة للتسديد:</div>';
        unpaid.forEach((inv,idx)=>{
          var rem=inv.total_amount-inv.paid_amount;
          var sel = idx===0 ? 'style="background:var(--text);color:var(--bg);border-color:var(--text);"' : '';
          var txt = idx===0 ? 'style="color:var(--bg);"' : '';
          h+='<div class="inv-select flex justify-between items-center px-3 py-2.5 rounded-xl border cursor-pointer text-sm" '+sel+' data-inv-id="'+inv.id+'" data-remaining="'+rem+'">';
          h+='<span class="font-semibold" '+txt+'>'+String(inv.month).padStart(2,'0')+'/'+inv.year+'</span>';
          h+='<span class="text-muted" '+txt+'>اجمالي: <strong '+txt+'>'+formatDinar(inv.total_amount)+'</strong></span>';
          h+='<span class="font-semibold" '+txt+'>'+formatDinar(rem)+'</span></div>';
        });
        document.getElementById('payInvoiceList').innerHTML=h;
        var f=unpaid[0];
        document.getElementById('payInvoiceId').value=f.id;
        document.getElementById('payRemaining').value=f.total_amount-f.paid_amount;
        document.getElementById('payAmount').value=f.total_amount-f.paid_amount;
        document.querySelectorAll('.inv-select').forEach(el=>{
          el.addEventListener('click',function(){
            document.querySelectorAll('.inv-select').forEach(e=>{e.removeAttribute('style');var s=e.querySelectorAll('span');s.forEach(sp=>sp.removeAttribute('style'));});
            var spanEls=this.querySelectorAll('span');
            this.setAttribute('style','background:var(--text);color:var(--bg);border-color:var(--text);');
            spanEls.forEach(sp=>sp.setAttribute('style','color:var(--bg);'));
            document.getElementById('payInvoiceId').value=this.dataset.invId;
            document.getElementById('payRemaining').value=this.dataset.remaining;
            document.getElementById('payAmount').value=this.dataset.remaining;
          });
        });
      });
    }
    function updatePayInvoiceInfoTotals(a,p,r){
      document.getElementById('payInvoiceInfo').innerHTML=
        '<span class="text-muted">الكلي:<strong class="text-main">'+formatDinar(a)+'</strong></span>'+
        '<span class="text-muted">مدفوع:<strong class="text-main">'+formatDinar(p)+'</strong></span>'+
        '<span class="text-muted">متبقي:<strong class="text-main">'+formatDinar(r)+'</strong></span>';
    }
    function adjustPayAmount(d){var i=document.getElementById('payAmount');i.value=(parseInt(i.value)||0)+d<0?0:(parseInt(i.value)||0)+d;}
    function adjustQuickPay(d){var i=document.getElementById('quickPayAmount');i.value=(parseInt(i.value)||0)+d<0?0:(parseInt(i.value)||0)+d;}

    var quickPayCustId=null;
    function openQuickPayModal(custId,fullAmount){
      quickPayCustId=custId;
      document.getElementById('quickPayFullAmount').textContent='جاري التحميل...';
      document.getElementById('quickPayAlreadyPaid').textContent='جاري التحميل...';
      document.getElementById('quickPayRemaining').textContent='جاري التحميل...';
      document.getElementById('quickPayAmount').value=''; document.getElementById('quickPayDate').value=todayStr;
      document.getElementById('quickPayNotes').value=''; document.getElementById('quickPayModal').style.display='block';
      fetch('/api/payment/current-invoice/'+custId).then(r=>r.json()).then(d=>{
        if(d.ok){
          var t=d.total!==undefined&&d.total!==null?d.total:fullAmount;
          var p=d.paid!==undefined&&d.paid!==null?d.paid:0;
          var r=d.remaining!==undefined&&d.remaining!==null?d.remaining:t;
          document.getElementById('quickPayFullAmount').textContent=formatDinar(t);
          document.getElementById('quickPayAlreadyPaid').textContent=formatDinar(p);
          document.getElementById('quickPayRemaining').textContent=formatDinar(r);
          document.getElementById('quickPayMaxAmount').value=r;
          if(r<=0){document.getElementById('quickPayAmount').value=0;document.getElementById('quickPayAmount').disabled=true;showToast('الفاتورة مدفوعة بالكامل','error');}
          else{document.getElementById('quickPayAmount').value=r;document.getElementById('quickPayAmount').disabled=false;}
        }
      });
    }
    async function submitQuickPay(){
      var amt=parseFloat(document.getElementById('quickPayAmount').value);
      if(!amt||amt<=0){showToast('الرجاء ادخال مبلغ صحيح','error');return;}
      var r=await fetch('/api/payment/quick-pay/'+quickPayCustId,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:amt,payment_date:document.getElementById('quickPayDate').value,payment_method:document.getElementById('quickPayMethod').value,notes:document.getElementById('quickPayNotes').value.trim()})});
      var d=await r.json();
      if(d.ok){var m='تم الدفع بنجاح — '+formatDinar(d.amount);if(d.remaining>0)m+=' | المتبقي: '+formatDinar(d.remaining);showToast(m);document.getElementById('quickPayModal').style.display='none';setTimeout(()=>location.reload(),800);}
      else{showToast(d.error||'حدث خطأ','error');}
    }
    async function submitSharedPayment(){
      var id=document.getElementById('payInvoiceId').value;
      var amt=parseFloat(document.getElementById('payAmount').value);
      if(!id){showToast('الرجاء اختيار فاتورة','error');return;}
      if(!amt||amt<=0){showToast('الرجاء ادخال مبلغ صحيح','error');return;}
      var r=await fetch('/api/payment/make',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invoice_id:parseInt(id),amount:amt,payment_date:document.getElementById('payDate').value,payment_method:document.getElementById('payMethod').value,notes:document.getElementById('payNotes').value.trim()})});
      var d=await r.json();
      if(d.ok){showToast('تم التسديد بنجاح');document.getElementById('paymentModal').style.display='none';setTimeout(()=>location.reload(),500);}
      else{showToast(d.error||'حدث خطأ','error');}
    }

    document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('paymentModal').style.display='none';document.getElementById('quickPayModal').style.display='none';document.getElementById('confirmModal').style.display='none';}});

    function showToast(msg,type){
      var t=document.getElementById('toast');
      t.textContent=msg;
      t.style.display='block';
      t.style.background = type==='error' ? 'var(--dot-expired)' : 'var(--toast-bg)';
      t.style.color = type==='error' ? '#fff' : 'var(--toast-text)';
      clearTimeout(t._timer);
      t._timer=setTimeout(()=>{t.style.display='none';},4000);
    }
    var numeralStyle='{{ numeral_style }}';
    var arabicDigits=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
    function toArabicNum(n){if(numeralStyle==='EN')return String(n);return String(n).replace(/[0-9]/g,function(d){return arabicDigits[parseInt(d)];});}
    function formatDinar(amount){var n=parseInt(amount)||0;var f=n.toLocaleString('en-US');return(numeralStyle==='EN'?f:toArabicNum(f))+' د.ع';}
    function formatArabicNumber(amount){var n=parseInt(amount)||0;var f=n.toLocaleString('en-US');return numeralStyle==='EN'?f:toArabicNum(f);}

    /* ─────────────── Relative days helper (subscribers) ─────────────── */
    function parseDateStr(s){
      if(!s) return null;
      var m=s.match(/(\d{4})-(\d{2})-(\d{2})/);
      if(m) return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));
      var d=new Date(s);
      return isNaN(d.getTime())?null:d;
    }
    function daysRemainingText(dateStr){
      var d=parseDateStr(dateStr);
      if(!d) return '';
      var today=new Date(); today.setHours(0,0,0,0); d.setHours(0,0,0,0);
      var diff=Math.round((d-today)/86400000);
      if(diff>0) return 'باقي '+formatArabicNumber(diff)+(diff===1?' يوم':' أيام');
      if(diff===0) return 'ينتهي اليوم';
      return 'منتهي منذ '+formatArabicNumber(Math.abs(diff))+' أيام';
    }
    function formatDayMonth(dateStr){
      var d=parseDateStr(dateStr);
      if(!d) return '—';
      var dd=String(d.getDate()).padStart(2,'0');
      var mm=String(d.getMonth()+1).padStart(2,'0');
      return dd+'/'+mm;
    }

    var _confirmCallback=null;
    function showConfirm(msg,cb){document.getElementById('confirmMsg').textContent=msg;_confirmCallback=cb;document.getElementById('confirmModal').style.display='block';}
    function confirmYes(){document.getElementById('confirmModal').style.display='none';if(_confirmCallback)_confirmCallback();}
    function confirmNo(){document.getElementById('confirmModal').style.display='none';_confirmCallback=null;}

    async function logoutNow(){
      showConfirm('تسجيل الخروج؟',async function(){
        var r=await fetch('/logout',{method:'POST'});var d=await r.json();
        if(d.ok)window.location.href='/login';else window.location.href='/login';
      });
    }
    if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/service-worker.js');}

    /* Copy/paste uses the browser's NATIVE long-press menu (Android Select/Copy/Paste).
       No custom clipboard helpers are needed — see the CSS user-select rules above. */
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
