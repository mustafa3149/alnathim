{% extends "layout.html" %}
{% block title %}فحص الاتصال{% endblock %}
{% block content %}

<div class="mb-6">
  <h1 class="text-2xl font-extrabold text-main" style="letter-spacing:-0.02em;">فحص الاتصال</h1>
  <p class="text-sm text-muted mt-1 font-tajawal">تشخيص الشبكة من الهاتف مباشرةً — بدون السيرفر</p>
</div>

<!-- Ping card -->
<div class="space-y-4">
  <div class="card card-pad">
    <div class="text-sm font-bold text-main mb-4">تشخيص الشبكة (Ping)</div>
    <div class="space-y-4">
      <div>
        <label class="f-label">العنوان (IP أو اسم النطاق)</label>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--faint);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="pingHost" dir="ltr" placeholder="google.com أو 192.168.1.1" class="input pr-4 pl-10" onkeydown="if(event.key==='Enter')doPing()">
        </div>
        <!-- Quick shortcuts (highly relevant targets) -->
        <div class="flex gap-2 mt-3 flex-wrap">
          <button onclick="setPingHost('google.com')" class="rounded-full px-3.5 py-1.5 text-[11px] font-semibold transition" style="border:1px solid var(--border-2);color:var(--muted);background:var(--surface);">Google</button>
          <button onclick="setPingHost('youtube.com')" class="rounded-full px-3.5 py-1.5 text-[11px] font-semibold transition" style="border:1px solid var(--border-2);color:var(--muted);background:var(--surface);">YouTube</button>
          <button onclick="setPingHost('facebook.com')" class="rounded-full px-3.5 py-1.5 text-[11px] font-semibold transition" style="border:1px solid var(--border-2);color:var(--muted);background:var(--surface);">Facebook</button>
          <button onclick="setPingHost('tiktok.com')" class="rounded-full px-3.5 py-1.5 text-[11px] font-semibold transition" style="border:1px solid var(--border-2);color:var(--muted);background:var(--surface);">TikTok</button>
          <button onclick="setPingHost('1.1.1.1')" class="rounded-full px-3.5 py-1.5 text-[11px] font-semibold transition" style="border:1px solid var(--border-2);color:var(--muted);background:var(--surface);">1.1.1.1</button>
        </div>
      </div>
      <div>
        <label class="f-label">عدد الحزم</label>
        <input type="number" id="pingCount" dir="ltr" value="4" min="1" max="10" class="input">
      </div>
      <button onclick="doPing()" id="pingBtn" class="btn btn-primary w-full py-3">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        فحص مباشر من الهاتف
      </button>
    </div>
  </div>
  <div id="pingResult" class="hidden"></div>
</div>

{% endblock %}
{% block extra_scripts %}
<script>
// ── Native bridge (AlNathimNative): phone-side ping when running in the app ──
// Only used inside the Android WebView. In a normal browser the page falls
// back to the server (/api/network/ping).
var NATIVE = (typeof window.AlNathimNative !== 'undefined' && window.AlNathimNative !== null);
var _cbSeq = 0;
var _cbs = {};
window.onNativeResult = function(callbackId, json){
  var cb = _cbs[callbackId];
  if(cb){ delete _cbs[callbackId]; cb(json || {}); }
};
function nativeCall(method, payload, cb){
  var id = 'cb' + (++_cbSeq);
  _cbs[id] = cb;
  var args = [payload.ip||'', id];
  try { window.AlNathimNative[method].apply(null, args); }
  catch(e){ delete _cbs[id]; if(cb) cb({ok:false, error:'الفحص المحلي غير متاح'}); }
}

function setPingHost(host){ document.getElementById('pingHost').value = host; }

async function doPing(){
  var host = document.getElementById('pingHost').value.trim();
  // اقرأ عدد الحزم من حقل الإدخال مع تقييد بين 1 و 10
  var rawCount = parseInt(document.getElementById('pingCount').value, 10);
  var count = Math.min(Math.max(isNaN(rawCount) ? 4 : rawCount, 1), 10);
  document.getElementById('pingCount').value = count; // عكس القيمة المقيدة في الحقل
  if(!host){ showToast('يرجى ادخال عنوان', 'error'); return; }
  var btn = document.getElementById('pingBtn'); btn.textContent = '⏳ جاري الفحص...'; btn.disabled = true;
  var box = document.getElementById('pingResult'); box.style.display = 'block'; box.innerHTML = '<div class="text-center text-muted py-6">جاري الفحص ('+count+' حزم)...</div>';
  function render(d){
    if(d && d.ok){
      var c = d.loss_percent > 20 ? 'var(--dot-expired)' : (d.loss_percent > 0 ? 'var(--muted)' : 'var(--dot-active)');
      box.innerHTML = '<div class="card card-pad"><div class="grid grid-cols-2 gap-2">'
        + '<div class="rounded-xl surface-2 p-3 text-center" style="border:1px solid var(--border);"><div class="text-[10px] text-muted font-tajawal">متوسط</div><div class="font-extrabold text-lg" style="color:'+c+';">'+(d.avg_ms!==null&&d.avg_ms!==undefined?d.avg_ms+' ms':'—')+'</div></div>'
        + '<div class="rounded-xl surface-2 p-3 text-center" style="border:1px solid var(--border);"><div class="text-[10px] text-muted font-tajawal">أقل</div><div class="font-extrabold text-lg text-main">'+(d.min_ms!==null&&d.min_ms!==undefined?d.min_ms+' ms':'—')+'</div></div>'
        + '<div class="rounded-xl surface-2 p-3 text-center" style="border:1px solid var(--border);"><div class="text-[10px] text-muted font-tajawal">أعلى</div><div class="font-extrabold text-lg text-main">'+(d.max_ms!==null&&d.max_ms!==undefined?d.max_ms+' ms':'—')+'</div></div>'
        + '<div class="rounded-xl surface-2 p-3 text-center" style="border:1px solid var(--border);"><div class="text-[10px] text-muted font-tajawal">فقدان</div><div class="font-extrabold text-lg" style="color:'+c+';">'+d.loss_percent+'%</div></div>'
        + '</div><div class="text-center text-[11px] text-faint font-tajawal mt-3">أرسل '+d.sent+' · استلم '+d.received+' · خسارة '+d.loss_percent+'% · زمن '+(d.elapsed_sec!==undefined?d.elapsed_sec+' ث':'—')+'</div>'
        + (d.is_tcp_probe ? '<div class="text-center text-[11px] text-muted font-tajawal mt-1" style="color:var(--dot-active);">فحص مباشر من الهاتف</div>' : '')
        + '</div>';
    } else { box.innerHTML = '<div class="card card-pad text-center" style="color:var(--dot-expired);font-weight:600;">'+(d&&d.error||'فشل')+'</div>'; }
    btn.textContent = 'فحص مباشر من الهاتف'; btn.disabled = false;
  }
  if(NATIVE){
    // فحص ICMP مباشرة من الهاتف عبر الجسر المحلي (لا يمر على السيرفر)
    nativeCall('pingHost', {ip: host}, render);
  } else {
    try{
      var r = await fetch('/api/network/ping', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({host:host, count:count})});
      var d = await r.json();
      render(d);
    } catch(e){ box.innerHTML = '<div class="card card-pad text-center" style="color:var(--dot-expired);">خطأ</div>'; btn.textContent = 'فحص مباشر من الهاتف'; btn.disabled = false; }
  }
}
</script>
{% endblock %}
