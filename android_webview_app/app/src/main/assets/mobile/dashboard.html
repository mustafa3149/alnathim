<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الناظم — اللوحة</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-enter">
  <!-- Top bar -->
  <div class="topbar">
    <h1>الناظم</h1>
    <div class="topbar-actions">
      <span id="userName" style="font-size:12px;color:var(--muted);font-weight:700;"></span>
      <button onclick="logout()" title="خروج">⏻</button>
    </div>
  </div>

  <div class="container">
    <div class="page-title">اللوحة</div>
    <div class="page-sub">نظرة مالية سريعة</div>

    <div class="kpi-grid">
      <div class="kpi"><div class="k-label">الدخل المتوقع</div><div class="k-value" id="statIncome">—</div></div>
      <div class="kpi"><div class="k-label">إجمالي الديون</div><div class="k-value" id="statDebt" style="color:var(--expired);">—</div></div>
      <div class="kpi"><div class="k-label">المحصل اليوم</div><div class="k-value" id="statToday" style="color:var(--active);">—</div></div>
      <div class="kpi"><div class="k-label">نشطين</div><div class="k-value" id="statActive">—</div></div>
    </div>

    <!-- Quick actions -->
    <div class="section-label">سريع</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <a href="customers.html" class="card" style="padding:14px;text-align:center;text-decoration:none;color:var(--text);">
        <div style="font-size:22px;">👥</div><div style="font-size:13px;font-weight:700;margin-top:4px;">العملاء</div>
      </a>
      <a href="debts.html" class="card" style="padding:14px;text-align:center;text-decoration:none;color:var(--text);">
        <div style="font-size:22px;">💸</div><div style="font-size:13px;font-weight:700;margin-top:4px;">الديون</div>
      </a>
    </div>

    <!-- Expiring this week -->
    <div class="section-label" id="expLabel">المنتهيون هذا الأسبوع</div>
    <div id="expiringBox">
      <div class="spinner">جاري التحميل...</div>
    </div>

    <!-- Recent payments -->
    <div class="section-label">آخر المدفوعات</div>
    <div id="payBox">
      <div class="spinner">جاري التحميل...</div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>الرئيسية</span>
    </a>
    <a href="customers.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span>العملاء</span>
    </a>
    <a href="billing.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>الفواتير</span>
    </a>
    <a href="debts.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      <span>الديون</span>
    </a>
    <a href="more.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      <span>المزيد</span>
    </a>
  </nav>

  <script src="js/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('redirect');
    const u = getUser();
    if (u) document.getElementById('userName').textContent = u.full_name || u.username || '';

    function renderSummary(d) {
      document.getElementById('statIncome').textContent = formatDinar(d.expected_income ?? d.total_expected ?? 0);
      document.getElementById('statDebt').textContent = formatDinar(d.total_debt ?? 0);
      document.getElementById('statToday').textContent = formatDinar(d.collected_today ?? 0);
      document.getElementById('statActive').textContent = toArabicNum(d.active_customers ?? d.total_customers ?? 0);

      const expBox = document.getElementById('expiringBox');
      document.getElementById('expLabel').textContent = 'المنتهيون هذا الأسبوع (' + toArabicNum(d.expiring_this_week ?? 0) + ')';
      const exp = d.expiring_customers || [];
      if (!exp.length) {
        expBox.innerHTML = '<div class="empty"><div class="big">✅</div>لا أحد ينتهي هذا الأسبوع</div>';
      } else {
        expBox.innerHTML = '<div class="list-card">' + exp.map(e =>
          '<a class="row" href="customer-detail.html?id=' + e.id + '">' +
            stateDot('expired') +
            '<div class="row-main">' +
              '<div class="row-title">' + esc(e.name) + '</div>' +
              '<div class="row-sub">' + esc(e.package_name || '') + ' · ينتهي ' + esc(String(e.renewal_date || '').slice(0,10)) + '</div>' +
            '</div>' +
            '<span class="menu-arrow">‹</span>' +
          '</a>').join('') + '</div>';
      }

      const payBox = document.getElementById('payBox');
      const pays = d.recent_payments || [];
      if (!pays.length) {
        payBox.innerHTML = '<div class="empty"><div class="big">💳</div>لا مدفوعات بعد</div>';
      } else {
        payBox.innerHTML = '<div class="list-card">' + pays.map(p =>
          '<div class="row">' +
            '<div class="row-main">' +
              '<div class="row-title">' + (p.customer_name ? esc(p.customer_name) : 'زبون #' + p.customer_id) + '</div>' +
              '<div class="row-sub">' + esc(p.payment_date || '') + ' · ' + esc(p.payment_method || '') + '</div>' +
            '</div>' +
            '<div class="row-end" style="font-weight:800;color:var(--active);">' + formatDinar(p.amount || 0) + '</div>' +
          '</div>').join('') + '</div>';
      }
    }

    loadCached('dashboard', '/dashboard/summary', renderSummary, (err) => {
      document.getElementById('expiringBox').innerHTML = '<div class="empty">' + esc(err) + '</div>';
      document.getElementById('payBox').innerHTML = '';
      showToast(err, 'error');
    });

    // Blood-style speed: keep the server warm and seed the cache so every
    // page opens instantly from local storage on first navigation.
    startKeepAlive();
    warmupCache();
  </script>
</body>
</html>
